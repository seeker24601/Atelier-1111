name: Release
# Push a tag like v0.2.0 to build a draft release. The tag must match "version"
# in src-tauri/tauri.conf.json. Each job signs its updater bundle and adds itself
# to the release's latest.json, which the app's Check for updates reads.
# A draft is invisible to Check for updates (it reads releases/latest), so the
# installers can be tried first; publishing the draft on GitHub is what ships it.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # One draft, created before the builds. GitHub's lookup by tag does not see
  # drafts, so builds left to create their own would each make a separate one.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Atelier-1111 $GITHUB_REF_NAME" \
            -F draft=true -F prerelease=false --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # There is no "tauri" npm script; call the CLI directly.
          tauriScript: npx tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
      - run: node scripts/verify-desktop.mjs
