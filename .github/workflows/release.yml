name: Release
# Push a tag like v0.2.3 to build it. The tag must match "version" in
# src-tauri/tauri.conf.json. Each build job signs its updater bundle and adds
# itself to the release's latest.json.
#
# Every build ships as a pre-release first, and its latest.json is copied to
# the test-channel feed, which Atelier reads when "Include test builds" is on.
# Releases everyone gets come from promoting a tested pre-release (the Promote
# workflow), so what testers ran is exactly what ships. Check for updates reads
# releases/latest, which never includes a pre-release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # One draft, created before the builds. GitHub's lookup by tag does not see
  # drafts, so builds left to create their own would each make a separate one.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Atelier-1111 $GITHUB_REF_NAME" \
            -F draft=true -F prerelease=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # There is no "tauri" npm script; call the CLI directly.
          tauriScript: npx tauri
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
      - run: node scripts/verify-desktop.mjs
  # Only once every platform built: publish as a pre-release and point the
  # test feed at it. A failed build leaves the draft unpublished.
  publish:
    needs: [draft, release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the pre-release
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false -F prerelease=true -f make_latest=false --silent
      # Fixed names, so seeker-studio.games/atelier/ can link to
      # releases/latest/download/<name> and always serve the current release.
      # releases/latest never resolves to a pre-release, so the site only ever
      # offers a promoted build.
      - name: Attach installers under fixed names
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D dl \
            -p '*_x64-setup.exe' -p '*_aarch64.dmg' -p '*_x64.dmg'
          cp dl/*_x64-setup.exe dl/Atelier-1111-windows-x64-setup.exe
          cp dl/*_aarch64.dmg dl/Atelier-1111-macos-apple-silicon.dmg
          cp dl/*_x64.dmg dl/Atelier-1111-macos-intel.dmg
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            dl/Atelier-1111-windows-x64-setup.exe dl/Atelier-1111-macos-apple-silicon.dmg dl/Atelier-1111-macos-intel.dmg
      - name: Point the test feed at it
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json -D feed
          if ! gh release view test-channel -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create test-channel -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Test channel (update feed)" \
              --notes "Holds the update feed for Atelier's \"Include test builds\" setting. Not a release to download."
          fi
          gh release upload test-channel feed/latest.json -R "$GITHUB_REPOSITORY" --clobber
