name: Release
# Push a tag like v0.2.0 to publish. The tag must match "version" in
# src-tauri/tauri.conf.json. Each job signs its updater bundle and adds itself
# to the release's latest.json, which the app's Check for updates reads.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # There is no "tauri" npm script; call the CLI directly.
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Atelier-1111 ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: false
          prerelease: false
      - run: node scripts/verify-desktop.mjs
