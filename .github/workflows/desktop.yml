name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'server/**', 'scripts/**', 'public/**', 'src-tauri/**', 'package*.json', 'index.html', 'vite.config.js', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - run: node scripts/verify-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
